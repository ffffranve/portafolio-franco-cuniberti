name: Redirect GitHub Pages to the main site

# The portfolio lives on Firebase Hosting (https://portafolio-franco-cuniberti.web.app).
# GitHub Pages only serves a tiny page that forwards old links there,
# so Google sees a single site instead of two copies.

on:
  push:
    branches: [main]
    paths: [github-redirect/**, .github/workflows/deploy.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
